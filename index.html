    <script>
      /* Zero-flash pre-paint theme, mode, font-pair & radius initializer */
      (function () {
        try {
          var validThemes = { dawn: 1, campus: 1, meadow: 1, ocean: 1, royal: 1, slate: 1 };
          var validModes = { light: 1, dark: 1, system: 1 };
          var validFonts = { heritage: 1, modern: 1, editorial: 1 };
          var validRadii = { sharp: 1, rounded: 1, soft: 1 };
          var rawApp = localStorage.getItem('school_theme_appearance');
          var app = rawApp ? JSON.parse(rawApp) : {};
          var theme = validThemes[app.theme] ? app.theme : 'dawn';
          var showToggle = typeof app.showModeToggle === 'boolean' ? app.showModeToggle : true;
          var defMode = validModes[app.defaultMode] ? app.defaultMode : 'light';
          var userMode = showToggle ? localStorage.getItem('school_mode_preference') : null;
          var mode = validModes[userMode] ? userMode : defMode;
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (sysDark ? 'dark' : 'light') : mode;
          var fontPair = validFonts[app.fontPair] ? app.fontPair : 'heritage';
          var radius = validRadii[app.radius] ? app.radius : 'rounded';
          var el = document.documentElement;
          el.setAttribute('data-theme', theme);
          el.setAttribute('data-mode', mode);
          el.setAttribute('data-resolved-mode', resolved);
          el.setAttribute('data-font-pair', fontPair);
          el.setAttribute('data-radius', radius);
          if (resolved === 'dark') el.classList.add('dark');
          else el.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
