<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অফলাইন | Offline — ASHAR ALO</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #FFFDF7;
        color: #1C1917;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14110F;
          color: #FAF5EE;
        }
        .card {
          background: #1B1613 !important;
          border-color: #75685A !important;
        }
        .muted {
          color: #C7BDB1 !important;
        }
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #FFFFFF;
        border: 1px solid rgba(138, 127, 109, 0.35);
        border-radius: 20px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 12px 32px rgba(28, 25, 23, 0.08);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: #FEF3C7;
        color: #92400E;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 800;
      }
      .muted {
        color: #57534E;
        font-size: 0.9rem;
        margin: 0 0 1.5rem;
      }
      button {
        appearance: none;
        border: none;
        background: #B45309;
        color: #FFFFFF;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #92400E;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">অফলাইন সংযোগ • Offline</div>
      <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন রয়েছে</h1>
      <p class="muted">
        আপনার ডিভাইসটি বর্তমানে ইন্টারনেটের সাথে যুক্ত নয়। সংযোগ ফিরে এলে নিচের বোতামে চাপ দিয়ে পুনরায় চেষ্টা করুন।<br /><br />
        You are currently offline. Please check your connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">আবার চেষ্টা করুন / Retry</button>
    </main>
  </body>
</html>
